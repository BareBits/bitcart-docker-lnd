services:
  bitcoin:
    restart: unless-stopped
    image: bitcart/bitcart-btc:stable
    # Built locally by build-custom-images.sh — don't try to pull from Docker Hub
    pull_policy: never
    environment:
      BTC_NETWORK: ${BTC_NETWORK:-mainnet}
      BTC_LIGHTNING: ${BTC_LIGHTNING:-false}
      BTC_LIGHTNING_GOSSIP: ${BTC_LIGHTNING_GOSSIP:-false}
      BTC_DEBUG: ${BTC_DEBUG:-false}
    expose:
      - "5000"
    volumes:
      - "bitcoin_datadir:/data"

  backend:
    depends_on:
      - bitcoin
    links:
      - bitcoin

volumes:
  bitcoin_datadir:
